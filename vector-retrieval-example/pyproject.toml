readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fonttools>=4,<5",
    "pydantic>=2,<3",
    "chromadb>=1.4,<2",
    "langchain-chroma>=1.1,<2",
    "langchain-openai>=1.1,<2",
    "langchain-text-splitters>=1.0,<2",
    "langgraph>=1.1,<2",
    "pypdf>=6.0,<7",
    "python-dotenv>=1.2,<2",
]

[tool.uv]
package = false
